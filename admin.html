<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Know UAV · لوحة التحكم</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<style>
main{padding-block:24px 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.stats div{background:var(--panel);padding:16px 18px}
.stats b{display:block;font-family:var(--f-mono);font-size:28px;color:var(--sand);font-weight:600}
.stats span{font-size:13px;color:var(--muted)}
.stats .warn b{color:var(--signal)}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--sand);color:var(--ink);font-weight:600}
.rcpts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.rc .img{aspect-ratio:4/3;background:#000;display:grid;place-items:center;overflow:hidden}
.rc .img img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.rc .img a{color:var(--sand)}
.rc .meta{padding:12px 14px;display:grid;gap:4px;font-size:14px}
.rc .meta .em{font-family:var(--f-mono);direction:ltr;text-align:right;color:var(--muted);font-size:12px;word-break:break-all}
.rc .acts{display:flex;gap:8px;padding:0 14px 14px}
.rc .acts .btn{flex:1}
.btn.no{border-color:var(--bad);color:var(--bad)}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--sand-dim);font-weight:600;font-size:13px}
td .mono{direction:ltr;unicode-bidi:isolate}
.search{background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:9px 16px;color:var(--text);font:inherit;width:100%;max-width:360px;margin-bottom:12px}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;max-width:820px}
.lb{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:90;padding:16px}
.lb img{max-width:100%;max-height:90vh;border-radius:8px}
.empty{color:var(--muted);padding:30px;text-align:center;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="brand" href="/"><img src="/assets/logo.png" alt="Know UAV" width="64" height="30"></a><nav class="nav"><a href="/app">الموقع</a></nav></div></header>
<main class="wrap">
  <div id="gate" class="empty">جارٍ التحقق…</div>
  <div id="panel" hidden>
    <h1 style="font-size:28px;margin-bottom:16px">لوحة التحكم</h1>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"><button data-t="pending" class="on">إيصالات للمراجعة</button><button data-t="all">كل الإيصالات</button><button data-t="users">المستخدمون</button><button data-t="settings">بيانات التحويل</button></div>
    <section id="t-pending"></section>
    <section id="t-all" hidden></section>
    <section id="t-users" hidden></section>
    <section id="t-settings" hidden></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
<script>
(async function(){
  const fmt = d => d ? new Date(d).toLocaleString('ar-SA-u-ca-gregory', {dateStyle:'medium', timeStyle:'short'}) : '—';
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $('#gate').innerHTML = 'سجّل دخولك أولاً من <a href="/app#login">صفحة الدخول</a>.'; return; }
  const { data: me } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
  if(!me || !me.is_admin){ $('#gate').textContent = 'هذه الصفحة للمسؤول فقط.'; return; }
  $('#gate').hidden = true; $('#panel').hidden = false;
  let profiles = {};

  async function stats(){
    const { data } = await sb.rpc('admin_stats');
    const s = data || {};
    $('#stats').innerHTML = `<div><b>${s.users ?? 0}</b><span>حسابات</span></div><div><b>${s.active ?? 0}</b><span>حسابات مفعّلة</span></div><div class="warn"><b>${s.pending ?? 0}</b><span>إيصالات للمراجعة</span></div><div><b>${s.blocked ?? 0}</b><span>حسابات موقوفة</span></div>`;
  }
  async function loadProfiles(){ const { data } = await sb.from('profiles').select('*').order('created_at', {ascending:false}).limit(2000); profiles = Object.fromEntries((data||[]).map(p => [p.id, p])); return data || []; }

  async function receipts(el, status){
    el.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
    let q = sb.from('payments').select('*').order('created_at', {ascending: status !== 'pending'}).limit(200);
    if(status === 'pending') q = q.eq('status','pending');
    const { data } = await q;
    if(!data || !data.length){ el.innerHTML = `<div class="empty">${status === 'pending' ? 'لا توجد إيصالات تنتظر المراجعة.' : 'لا توجد إيصالات بعد.'}</div>`; return; }
    const urls = await sb.storage.from('receipts').createSignedUrls(data.map(p => p.receipt_path), 3600);
    const map = Object.fromEntries((urls.data||[]).map(u => [u.path, u.signedUrl]));
    const lbl = {pending:'<span class="chip">قيد المراجعة</span>', approved:'<span class="chip ok">مقبول</span>', rejected:'<span class="chip bad">مرفوض</span>'};
    el.innerHTML = `<div class="rcpts">${data.map(p => { const u = map[p.receipt_path], pr = profiles[p.user_id] || {}; const pdf = /\.pdf$/i.test(p.receipt_path);
      return `<div class="rc" data-id="${p.id}"><div class="img">${u ? (pdf ? `<a href="${u}" target="_blank" rel="noopener">فتح ملف PDF</a>` : `<img src="${u}" alt="إيصال" loading="lazy">`) : '<span class="note">الملف غير متاح</span>'}</div>
        <div class="meta"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.sender_name || '—')}</b>${lbl[p.status]}</div><div class="em">${esc(pr.email || p.user_id)}</div><div class="note">${fmt(p.created_at)} · ${esc(p.amount ?? '')} ر.س</div>${p.note ? `<div class="note">ملاحظة: ${esc(p.note)}</div>` : ''}</div>
        ${p.status === 'pending' ? `<div class="acts"><button class="btn pri sm" data-ok>قبول</button><button class="btn sm no" data-no>رفض وإيقاف الحساب</button></div>` : ''}</div>`; }).join('')}</div>`;
    el.querySelectorAll('.rc img').forEach(i => i.onclick = () => { const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = `<img src="${i.src}" alt="إيصال">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); });
    el.querySelectorAll('.rc').forEach(card => {
      const id = +card.dataset.id, ok = card.querySelector('[data-ok]'), no = card.querySelector('[data-no]');
      if(ok) ok.onclick = async () => { ok.disabled = true; const { error } = await sb.rpc('admin_review', {p_id:id, p_approve:true}); if(error) return toast(error.message, 1); toast('تم القبول'); card.remove(); stats(); };
      if(no) no.onclick = async () => {
        if(no.dataset.sure !== '1'){ no.dataset.sure = '1'; no.textContent = 'اضغط مرة ثانية للتأكيد'; setTimeout(() => { no.dataset.sure = ''; no.textContent = 'رفض وإيقاف الحساب'; }, 4000); return; }
        no.disabled = true; const { error } = await sb.rpc('admin_review', {p_id:id, p_approve:false, p_note:'إيصال غير صحيح'}); if(error) return toast(error.message, 1); toast('تم الرفض وإيقاف الحساب'); card.remove(); stats(); };
    });
  }

  async function users(el){
    const list = await loadProfiles();
    el.innerHTML = `<input class="search" id="u-q" type="search" placeholder="ابحث بالبريد أو الاسم"><div class="tbl-wrap"><table><thead><tr><th>البريد</th><th>الاسم</th><th>التسجيل</th><th>التفعيل</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="u-b"></tbody></table></div>`;
    const draw = () => { const q = $('#u-q').value.trim().toLowerCase(); $('#u-b').innerHTML = list.filter(p => !q || ((p.email||'')+' '+(p.full_name||'')).toLowerCase().includes(q)).slice(0, 300).map(p => {
      const act = p.active_until && new Date(p.active_until) > new Date() && !p.blocked;
      return `<tr data-u="${p.id}"><td><span class="mono">${esc(p.email)}</span></td><td>${esc(p.full_name||'')}</td><td>${fmt(p.created_at)}</td><td>${act ? 'مفعّل' : '—'}</td><td>${p.blocked ? '<span class="chip bad">موقوف</span>' : act ? '<span class="chip ok">مفعّل</span>' : '<span class="chip">مجاني</span>'}${p.is_admin ? ' <span class="chip sand">مسؤول</span>' : ''}</td>
        <td><div class="row" style="gap:6px">${p.blocked ? '<button class="btn sm" data-unb>إلغاء الإيقاف</button>' : '<button class="btn sm no" data-blk>إيقاف</button>'}${act ? '' : '<button class="btn sm" data-g>تفعيل</button>'}</div></td></tr>`; }).join(''); };
    $('#u-q').oninput = draw; draw();
    $('#u-b').onclick = async e => { const tr = e.target.closest('tr'); if(!tr) return; const u = tr.dataset.u;
      if(e.target.matches('[data-blk],[data-unb]')){ const { error } = await sb.rpc('admin_set_blocked', {p_user:u, p_blocked: e.target.matches('[data-blk]')}); if(error) return toast(error.message,1); toast('تم'); users(el); stats(); }
      if(e.target.matches('[data-g]')){ const { error } = await sb.rpc('admin_grant', {p_user:u, p_days:36500}); if(error) return toast(error.message,1); toast('تم تفعيل الحساب'); users(el); stats(); } };
  }

  async function settings(el){
    const { data } = await sb.from('app_settings').select('*');
    const s = Object.fromEntries((data||[]).map(r => [r.key, r.value]));
    const F = [['price','سعر التفعيل (ريال)'],['bank_name','اسم البنك'],['account_name','اسم صاحب الحساب'],['iban','رقم الآيبان IBAN'],['stcpay','رقم STC Pay'],['pay_note','ملاحظة تظهر للمشترك']];
    el.innerHTML = `<div class="card"><p class="note" style="margin-top:0">هذه البيانات تظهر للمستخدم في صفحة الدفع. الحقل الفارغ لا يظهر.</p><form id="set-f" class="set">${F.map(([k,l]) => `<label class="field">${l}<input name="${k}" value="${esc(s[k]||'')}" ${k==='iban'||k==='stcpay'||k==='price'?'dir="ltr"':''}></label>`).join('')}</form><div class="row" style="margin-top:16px"><button class="btn pri" id="set-save">حفظ</button></div></div>`;
    $('#set-save').onclick = async () => { const rows = [...new FormData($('#set-f')).entries()].map(([key,value]) => ({key, value: String(value).trim()}));
      const { error } = await sb.from('app_settings').upsert(rows); if(error) return toast(error.message, 1); toast('تم الحفظ'); };
  }

  const views = { pending: el => receipts(el,'pending'), all: el => receipts(el,'all'), users, settings };
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; $$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); Object.keys(views).forEach(k => $('#t-'+k).hidden = k !== b.dataset.t); views[b.dataset.t]($('#t-'+b.dataset.t)); };
  await loadProfiles(); stats(); receipts($('#t-pending'), 'pending');
})();
</script>
</body>
</html>
