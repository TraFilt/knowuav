<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Know UAV · بث مباشر</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
html,body{margin:0;height:100%;background:#050806;overflow:hidden}
[hidden]{display:none!important}
.stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center;overflow:hidden;color:#f2ead2;font-family:'Readex Pro',sans-serif;
 background:radial-gradient(900px 600px at 50% 8%,#2c3a2fcc,transparent 70%),radial-gradient(900px 700px at 50% 100%,#d8bf861f,transparent 70%),linear-gradient(#0e1611,#070a08)}
.stage::before{content:"";position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#d8bf8633 1px,transparent 1px),linear-gradient(90deg,#d8bf8633 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.hd{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:center}
.hd img{height:130px}
.brand{display:flex;align-items:center;gap:22px}
.brand img{height:84px}
.brand .t{display:grid}
.brand b{font-family:'Reem Kufi',sans-serif;font-size:66px;line-height:1;color:#d8bf86}
.brand span{font-size:30px;color:#cfc6ae;margin-top:6px}
.live{display:flex;align-items:center;gap:10px;background:#ff3b30;color:#fff;font-weight:600;font-size:28px;padding:8px 20px;border-radius:12px;letter-spacing:1px}
.live i{width:14px;height:14px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.bio{position:absolute;top:206px;left:60px;right:60px;display:flex;justify-content:center}
.bio div{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,#ff8f45,#f2b25c);color:#1a0d02;font-weight:700;font-size:42px;padding:16px 40px;border-radius:999px;box-shadow:0 0 60px #ff8f4566}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 90px #ff8f4599}}
.bio .arr{font-size:46px;animation:up 1.1s ease-in-out infinite}
@keyframes up{50%{transform:translateY(-8px)}}
.cap{position:absolute;top:312px;left:60px;right:60px;height:110px;display:grid;place-items:center;text-align:center}
.cap p{margin:0;font-size:38px;white-space:nowrap;font-weight:600;line-height:1.3;background:#0b100dcc;border:2px solid #d8bf8655;border-radius:26px;padding:16px 34px;transition:opacity .5s,transform .5s}
.cap p.out{opacity:0;transform:translateY(12px)}
.cap p b{color:#d8bf86}
.bayw{position:absolute;top:440px;left:40px;right:40px;height:900px;border-radius:34px;overflow:hidden;border:3px solid #d8bf8666;box-shadow:0 30px 90px #000c}
#simbay{width:100%!important;height:100%!important;aspect-ratio:auto!important;border-radius:0!important;border:0!important;max-width:none!important}
#simbay .fsbar,#simbay .touch,#simbay .tbtn,#simbay .horizon,#simbay .hud .bot{display:none!important}
#simbay .hud .tl,#simbay .hud .tr{top:18px!important;font-size:22px!important;padding:12px 18px!important;gap:4px!important;border-radius:14px!important;line-height:1.3!important}
#simbay .hud .tl{left:18px!important}#simbay .hud .tr{right:18px!important}
#simbay .hud .tl b,#simbay .hud .tr b{font-size:28px!important}
#simbay .hud .obj{top:18px!important;font-size:28px!important;padding:12px 22px!important;max-width:52%!important;border-radius:14px!important;line-height:1.35!important}
#simbay .hud .obj small{font-size:22px!important}#simbay .hud .obj .ob{display:none!important}
#simbay .over{display:none!important}
.done.bad{background:#ff8f45;color:#2a1000}
.done{position:absolute;top:640px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;background:#7cd39b;color:#08200f;font-weight:700;font-size:54px;padding:20px 50px;border-radius:999px;transition:all .45s cubic-bezier(.2,1.4,.4,1);z-index:5;white-space:nowrap}
.done.on{opacity:1;transform:translateX(-50%) scale(1)}
.ctl{position:absolute;top:1370px;left:40px;right:40px;height:440px}
.ctl svg{width:100%;height:100%}
.ft{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px;color:#d8bf86;direction:ltr;letter-spacing:1px}
.stats{position:absolute;top:1360px;left:60px;right:60px;display:flex;justify-content:space-between;font-size:26px;color:#a8a08a}
.stats b{color:#f2ead2;font-family:'IBM Plex Mono',monospace}
.go{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000a}
.go button{font:inherit;font-size:22px;background:#d8bf86;color:#17130a;border:0;border-radius:999px;padding:14px 34px;font-weight:700;cursor:pointer}
.go p{color:#cfc6ae;font-size:14px;text-align:center;margin-top:10px}
.sink{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hd"><img src="/assets/logo.png" alt="Know UAV"></div>
  <div class="bio"><div>رابط الموقع في البايو</div></div>
  <div class="cap"><p><b>٢٥ ريال</b> مدى الحياة — <b>٢٠ درس</b> + <b>١٤ مهمة</b> محاكاة</p></div>

  <div class="bayw">
    <div class="bay" id="simbay">
      <div class="camfx" id="camfx" hidden aria-hidden="true"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><span class="rec"><b></b><em id="cf-mode">CAM</em> <span id="cf-rec">00:00</span></span><span class="fmt">4K · 30</span><span class="hdg" id="cf-hdg">000°</span><span class="ret"></span><span class="tiltbar"><i id="cf-tilt"></i></span></div>
      <div class="hud">
        <div class="tl"><span>ALT <b id="h-alt">0.0</b> m</span><span>SPD <b id="h-spd">0.0</b> m/s</span><span>V/S <b id="h-vs">0.0</b></span></div>
        <div class="tr"><span>BAT <b id="h-bat">100</b>%</span><div class="batbar"><i id="h-batbar" style="width:100%"></i></div><span>T <b id="h-t">00:00</b></span><span>HOME <b id="h-home">0</b> m</span></div>
        <div class="obj" id="h-obj"><span class="ot"></span><small id="h-objst"></small></div>
        <svg class="horizon" viewBox="-70 -70 140 140"><g id="h-hzg"></g></svg>
        <div class="bot"><div class="ministick"><i id="h-sl"></i></div><span class="armst" id="h-arm"></span><div class="ministick"><i id="h-sr"></i></div></div>
      </div>
      <div class="over" id="over" hidden><div class="box" id="overbox"></div></div>
    </div>
  </div>
  <div class="done" id="done">✔ أُنجزت المهمة</div>

  <div class="ctl">
    <svg viewBox="0 0 1000 440" aria-hidden="true">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26302a"/><stop offset="1" stop-color="#141a16"/></linearGradient>
        <radialGradient id="well" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#1b221d"/><stop offset="1" stop-color="#0a0e0b"/></radialGradient>
        <radialGradient id="knob" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f3dfaa"/><stop offset="1" stop-color="#a88a4c"/></radialGradient>
      </defs>
      <line x1="150" y1="70" x2="120" y2="-10" stroke="#8a826c" stroke-width="12" stroke-linecap="round"/>
      <line x1="850" y1="70" x2="880" y2="-10" stroke="#8a826c" stroke-width="12" stroke-linecap="round"/>
      <path d="M140 70 H860 Q940 70 950 150 L975 330 Q985 420 900 425 Q840 428 800 380 L740 320 H260 L200 380 Q160 428 100 425 Q15 420 25 330 L50 150 Q60 70 140 70Z" fill="url(#body)" stroke="#d8bf86" stroke-opacity=".55" stroke-width="3"/>
      <rect x="430" y="100" width="140" height="70" rx="12" fill="#070a08" stroke="#3a463d"/>
      <text id="scr1" x="500" y="128" fill="#7cd39b" font-size="20" font-family="IBM Plex Mono" text-anchor="middle">DISARMED</text>
      <text id="scr2" x="500" y="156" fill="#d8bf86" font-size="18" font-family="IBM Plex Mono" text-anchor="middle">THR 0%</text>
      <circle id="led" cx="500" cy="200" r="9" fill="#3a463d"/>
      <g transform="translate(270 245)"><circle r="125" fill="url(#well)" stroke="#3a463d" stroke-width="3"/><line x1="-100" y1="0" x2="100" y2="0" stroke="#d8bf86" stroke-opacity=".12" stroke-width="2"/><line x1="0" y1="-100" x2="0" y2="100" stroke="#d8bf86" stroke-opacity=".12" stroke-width="2"/>
        <line id="lsh" x1="0" y1="0" x2="0" y2="0" stroke="#5a6458" stroke-width="16" stroke-linecap="round"/><g id="lk"><circle r="40" fill="url(#knob)" stroke="#6b5a32" stroke-width="2"/><circle r="22" fill="none" stroke="#6b5a32" stroke-opacity=".5" stroke-width="2"/></g></g>
      <g transform="translate(730 245)"><circle r="125" fill="url(#well)" stroke="#3a463d" stroke-width="3"/><line x1="-100" y1="0" x2="100" y2="0" stroke="#d8bf86" stroke-opacity=".12" stroke-width="2"/><line x1="0" y1="-100" x2="0" y2="100" stroke="#d8bf86" stroke-opacity=".12" stroke-width="2"/>
        <line id="rsh" x1="0" y1="0" x2="0" y2="0" stroke="#5a6458" stroke-width="16" stroke-linecap="round"/><g id="rk"><circle r="40" fill="url(#knob)" stroke="#6b5a32" stroke-width="2"/><circle r="22" fill="none" stroke="#6b5a32" stroke-opacity=".5" stroke-width="2"/></g></g>
      <text x="270" y="405" fill="#a8a08a" font-size="24" font-family="Readex Pro" text-anchor="middle">الدفع · اللف</text>
      <text x="730" y="405" fill="#a8a08a" font-size="24" font-family="Readex Pro" text-anchor="middle">الميلان</text>
      <rect x="455" y="250" width="90" height="34" rx="17" fill="#0b100d" stroke="#3a463d"/><text x="500" y="274" fill="#a8a08a" font-size="18" font-family="IBM Plex Mono" text-anchor="middle">MODE 2</text>
    </svg>
  </div>
  <div class="ft">knowuav.com</div>

  <!-- hidden controls the simulator expects -->
  <div class="sink"><div id="mlist"></div><div id="keys"></div><div id="padst"></div><p id="h-brief"></p>
    <select id="s-level"><option value="1" selected>1</option></select><select id="s-mode"><option value="2" selected>2</option></select>
    <select id="s-cam"><option value="chase">c</option><option value="gimbal">g</option><option value="fpv">f</option><option value="pilot">p</option></select>
    <select id="s-touch"><option value="off" selected>off</option></select><select id="s-snd"><option value="1">1</option><option value="0">0</option></select><input type="range" id="s-vol" min="0" max="100" value="70"></div>
</div>
<div class="go" id="go"><div><button id="go-b">▶ ابدأ البث</button><p>اضغط لتشغيل الصوت. يبدأ لحاله بعد ٥ ثوانٍ بدون صوت.</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.$=s=>document.querySelector(s);window.$$=s=>[...document.querySelectorAll(s)];window.AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);window.toast=()=>{};</script>
<script>
// stream audio: quieter, softer drone (?dv=0..100 drone volume, ?mv=0..100 music volume)
(function(){const q=new URLSearchParams(location.search),n=(k,d)=>{const v=q.get(k);return v==null||isNaN(+v)?d:Math.max(0,Math.min(100,+v))/100};
 window.KU_DV=n('dv',.2);window.KU_MV=n('mv',.35);window.KU_SOFT_SND=true;
 try{localStorage.setItem('ku_sim_snd',JSON.stringify({on:window.KU_DV>0,vol:window.KU_DV}))}catch(e){}})();
</script>
<script src="/assets/sim.js"></script>
<script>
(function(){
  const stage = $('#stage');
  const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = `translate(-50%,-50%) scale(${k})`; };
  addEventListener('resize', fit); fit();

  // the controller mirrors the sticks (Mode 2: left = throttle/yaw, right = pitch/roll)
  const R = 82, lk = $('#lk'), rk = $('#rk'), lsh = $('#lsh'), rsh = $('#rsh'), led = $('#led'), s1 = $('#scr1'), s2 = $('#scr2');
  const sm = {lx:0, ly:0, rx:0, ry:0};
  function drawCtl(){
    const I = Sim.input || {}, st = Sim.state || {}, k = .35;
    sm.lx += ((I.yaw || 0) - sm.lx) * k; sm.ly += ((I.thr || 0) - sm.ly) * k; sm.rx += ((I.roll || 0) - sm.rx) * k; sm.ry += ((I.pitch || 0) - sm.ry) * k;
    const L = [sm.lx * R, -sm.ly * R], Rr = [sm.rx * R, -sm.ry * R];
    lk.setAttribute('transform', `translate(${L[0]} ${L[1]})`); lsh.setAttribute('x2', L[0] * .9); lsh.setAttribute('y2', L[1] * .9);
    rk.setAttribute('transform', `translate(${Rr[0]} ${Rr[1]})`); rsh.setAttribute('x2', Rr[0] * .9); rsh.setAttribute('y2', Rr[1] * .9);
    led.setAttribute('fill', st.armed ? '#7cd39b' : '#3a463d');
    s1.textContent = st.armed ? 'ARMED' : 'DISARMED'; s1.setAttribute('fill', st.armed ? '#ff8f45' : '#7cd39b');
    s2.textContent = 'THR ' + Math.round(((I.thr || 0) + 1) * 50) + '%';
    requestAnimationFrame(drawCtl);
  }

  const LIST = ['hover','box','gates','slalom','orbit','land','hangar','wind','pads','night','low','rth'];
  const done = $('#done');
  function onEv(e){
    if(e.type === 'done' || e.type === 'crash'){ const ok = e.type === 'done'; done.textContent = ok ? 'أُنجزت: ' + (e.mission && e.mission.title || '') : 'تحطّمت · نعيد المحاولة'; done.classList.toggle('bad', !ok); done.classList.add('on'); setTimeout(() => done.classList.remove('on'), 2600); }
  }
  // light generative background music (Web Audio, no files): soft pad + bass + bell arpeggio, 76 bpm
  function music(vol){
    if(!vol) return; const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const c = new AC(), out = c.createGain(); out.gain.value = 0; out.gain.setTargetAtTime(vol, c.currentTime + .5, 3);
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3; out.connect(comp); comp.connect(c.destination);
    // simple reverb from a decaying noise impulse
    const rv = c.createConvolver(), len = c.sampleRate * 3, ib = c.createBuffer(2, len, c.sampleRate);
    for(let ch = 0; ch < 2; ch++){ const d = ib.getChannelData(ch); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    rv.buffer = ib; const wet = c.createGain(); wet.gain.value = .45; rv.connect(wet); wet.connect(out);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; lp.connect(out); lp.connect(rv);
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    // Fmaj7 - Em7 - Dm7 - Cmaj7 (calm, loops forever)
    const CH = [[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
    const beat = 60 / 76, bar = beat * 4, chordLen = bar * 2;
    function note(f, t, dur, type, v, att, dest){
      const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + att); g.gain.setTargetAtTime(0, t + dur - att * .5, att * .6);
      o.connect(g); g.connect(dest || lp); o.start(t); o.stop(t + dur + att * 3);
    }
    let next = c.currentTime + .3, idx = 0;
    function sched(){
      while(next < c.currentTime + chordLen * 1.5){
        const ch = CH[idx % CH.length], t = next;
        ch.forEach(m => { note(hz(m), t, chordLen, 'triangle', .035, 1.4); note(hz(m) * 1.004, t, chordLen, 'sine', .03, 1.6); });
        note(hz(ch[0] - 12), t, bar * .95, 'sine', .09, .08); note(hz(ch[0] - 12), t + bar, bar * .95, 'sine', .08, .08);
        const arp = [ch[0] + 12, ch[1] + 12, ch[2] + 12, ch[3] + 12, ch[2] + 12, ch[1] + 12];
        for(let i = 0; i < 8; i++){ if(Math.random() < .35) continue; const m = arp[(i + idx) % arp.length]; note(hz(m), t + i * beat, beat * 1.6, 'sine', .028, .01); }
        next += chordLen; idx++;
      }
    }
    sched(); setInterval(sched, 1000);
    const wake = () => { if(c.state === 'suspended') c.resume().catch(() => {}); };
    wake(); addEventListener('pointerdown', wake); addEventListener('keydown', wake);
  }
  let started = false;
  function go(){ if(started) return; started = true; $('#go').hidden = true; Sim.enter(); Sim.autopilot(LIST, onEv); music(window.KU_MV); requestAnimationFrame(drawCtl); }
  $('#go-b').onclick = go; setTimeout(go, 5000);
  // keep the stream clean: no menus or pop-ups from the trainer
  new MutationObserver(() => { const o = $('#over'); if(o && !o.hidden && /جاهز تطير|🔒/.test(o.textContent)) o.hidden = true; }).observe($('#over'), {attributes:true, childList:true, subtree:true});
})();
</script>
</body>
