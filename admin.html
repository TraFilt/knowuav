<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Know UAV · لوحة التحكم</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<style>
main{padding-block:24px 60px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:28px}
.head .upd{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.kpis div{background:var(--panel);padding:14px 16px;display:grid;gap:2px}
.kpis b{font-family:var(--f-mono);font-size:26px;color:var(--sand);font-weight:600;direction:ltr;text-align:right}
.kpis span{font-size:13px;color:var(--muted)}
.kpis small{font-size:12px;color:var(--ok)}
.kpis .warn b{color:var(--signal)}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 15px;border-radius:999px;cursor:pointer;color:var(--muted);font:inherit;font-size:14px}
.tabs button.on{background:var(--sand);color:var(--ink);font-weight:600}
.tabs .n{font-family:var(--f-mono);font-size:11px;background:var(--signal);color:#1a0d02;border-radius:999px;padding:0 6px;margin-inline-start:6px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.box h3{font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.box h3 small{font-size:12px;color:var(--muted);font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.funnel{display:grid;gap:10px}
.funnel .r{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar{height:12px;background:#ffffff0d;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sand);border-radius:999px}
.bar.g i{background:var(--ok)}
.funnel .v{font-family:var(--f-mono);text-align:left;color:var(--text)}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini td,.mini th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
.mini th{color:var(--sand-dim);font-weight:600;font-size:12px}
.mini .num{font-family:var(--f-mono);direction:ltr;text-align:left;white-space:nowrap}
.mini .bar{height:8px;min-width:60px}
.rcpts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.rc .img{aspect-ratio:4/3;background:#000;display:grid;place-items:center;overflow:hidden}
.rc .img img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.rc .img a{color:var(--sand)}
.rc .meta{padding:12px 14px;display:grid;gap:4px;font-size:14px}
.rc .meta .em{font-family:var(--f-mono);direction:ltr;text-align:right;color:var(--muted);font-size:12px;word-break:break-all;cursor:pointer}
.rc .acts{display:flex;gap:8px;padding:0 14px 14px}
.rc .acts .btn{flex:1}
.btn.no{border-color:var(--bad);color:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:8px 16px;color:var(--text);font:inherit;width:100%;max-width:300px}
.sel{background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:7px 12px;color:var(--text);font:inherit;font-size:13px}
.flt{display:inline-flex;gap:4px;flex-wrap:wrap}
.flt button{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.flt button.on{border-color:var(--sand);color:var(--sand)}
.flt button em{font-style:normal;font-family:var(--f-mono);font-size:11px;opacity:.75;margin-inline-start:4px}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
table.t td,table.t th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
table.t th{color:var(--sand-dim);font-weight:600;font-size:13px;white-space:nowrap}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:#ffffff06}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who .t{display:grid;min-width:0}
.who .t b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.who .t span{font-family:var(--f-mono);direction:ltr;text-align:right;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.av{width:34px;height:34px;border-radius:50%;background:#d8bf861a;border:1px solid #d8bf8655;display:grid;place-items:center;color:var(--sand);font-weight:600;flex:none;overflow:hidden;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}
.num{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.feed{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.feed .e{background:var(--panel);padding:10px 14px;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;font-size:14px}
.feed .e .ic{font-size:18px;text-align:center}
.feed .e .w{color:var(--muted);font-size:12px;font-family:var(--f-mono);direction:ltr}
.feed .e .x{color:var(--muted);font-size:13px}
.drawer{position:fixed;inset:0;z-index:85;display:flex;justify-content:flex-start;background:#0008}
.drawer .pn{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--ground,#0b100d);border-inline-end:1px solid var(--line2);padding:20px 20px 60px;box-shadow:0 0 60px #000a}
.drawer .top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.drawer .top .av{width:58px;height:58px;font-size:22px}
.drawer .top h2{font-size:20px;margin:0}
.drawer .top .em{font-family:var(--f-mono);direction:ltr;text-align:right;color:var(--muted);font-size:13px;cursor:pointer}
.drawer .x{margin-inline-start:auto;border:1px solid var(--line2);background:none;color:var(--text);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.facts div{background:var(--panel);padding:9px 12px;font-size:13px;display:grid;gap:2px}
.facts span{color:var(--muted);font-size:12px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.drawer h4{font-size:14px;color:var(--sand);margin:16px 0 8px}
.lb{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:95;padding:16px}
.lb img{max-width:100%;max-height:90vh;border-radius:8px}
.empty{color:var(--muted);padding:26px;text-align:center;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r)}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;max-width:820px}
.sum{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.sum b{color:var(--sand);font-family:var(--f-mono)}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="brand" href="/"><img src="/assets/logo.png" alt="Know UAV" width="64" height="30"></a><nav class="nav"><a href="/app">الموقع</a></nav></div></header>
<main class="wrap">
  <div id="gate" class="empty">جارٍ التحقق…</div>
  <div id="panel" hidden>
    <div class="head"><h1>لوحة التحكم</h1><div class="row" style="gap:8px;align-items:center"><span class="upd" id="upd"></span><button class="btn sm" id="refresh">↻ تحديث</button></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs">
      <button data-t="overview" class="on">نظرة عامة</button>
      <button data-t="pending">إيصالات للمراجعة<span class="n" id="pn" hidden></span></button>
      <button data-t="all">كل الإيصالات</button>
      <button data-t="users">المستخدمون</button>
      <button data-t="activity">آخر النشاط</button>
      <button data-t="settings">بيانات التحويل</button>
    </div>
    <section id="t-overview"></section>
    <section id="t-pending" hidden></section>
    <section id="t-all" hidden></section>
    <section id="t-users" hidden></section>
    <section id="t-activity" hidden></section>
    <section id="t-settings" hidden></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
<script>
(async function(){
  const fmt = d => d ? new Date(d).toLocaleString('ar-SA-u-ca-gregory-nu-latn', {dateStyle:'medium', timeStyle:'short'}) : '—';
  const fmtD = d => d ? new Date(d).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', {day:'numeric', month:'short', year:'numeric'}) : '—';
  const ago = d => { if(!d) return '—'; const s = (Date.now() - new Date(d)) / 1000;
    if(s < 60) return 'الآن'; if(s < 3600) return 'قبل ' + Math.floor(s/60) + ' د'; if(s < 86400) return 'قبل ' + Math.floor(s/3600) + ' س';
    if(s < 86400*30) return 'قبل ' + Math.floor(s/86400) + ' يوم'; return fmtD(d); };
  const n = v => Number(v || 0).toLocaleString('en-US');
  const MN = { free:'طيران حر', hover:'الإقلاع والتحويم', box:'المربع', gates:'البوابات', land:'الهبوط الدقيق', wind:'تحويم مع رياح', rth:'العودة ببطارية منخفضة', slalom:'التعرّج بين الأعمدة', orbit:'الدوران حول البرج', low:'الممر المنخفض', pads:'الهبوط على ثلاث منصات', night:'البوابات الليلية', hangar:'المبنى الكبير: طيران حر', coins:'المبنى الكبير: اجمع الكرات' };
  const ini = p => esc(((p.full_name || p.email || '?').trim()[0] || '?').toUpperCase());
  const avatar = p => `<span class="av">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="" loading="lazy">` : ini(p)}</span>`;
  const isAct = p => p.active_until && new Date(p.active_until) > new Date() && !p.blocked;
  const status = p => (p.blocked ? '<span class="chip bad">موقوف</span>' : isAct(p) ? '<span class="chip ok">مفعّل</span>' : '<span class="chip">مجاني</span>') + (p.is_admin ? ' <span class="chip sand">مسؤول</span>' : '');
  const copy = t => { try { navigator.clipboard.writeText(t); toast('تم النسخ'); } catch(e){} };

  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $('#gate').innerHTML = 'سجّل دخولك أولاً من <a href="/app#login">صفحة الدخول</a>.'; return; }
  const { data: me } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
  if(!me || !me.is_admin){ $('#gate').textContent = 'هذه الصفحة للمسؤول فقط.'; return; }
  $('#gate').hidden = true; $('#panel').hidden = false;

  let OV = null, USERS = [], profiles = {}, newApi = true;

  /* ---------- data ---------- */
  async function loadOverview(){
    const { data, error } = await sb.rpc('admin_overview');
    if(error){ newApi = false; const r = await sb.rpc('admin_stats'); OV = r.data || {}; } else OV = data || {};
    drawKpis(); $('#upd').textContent = 'آخر تحديث ' + new Date().toLocaleTimeString('ar-SA-u-nu-latn', {hour:'2-digit', minute:'2-digit'});
  }
  async function loadUsers(){
    if(newApi){ const { data, error } = await sb.rpc('admin_users'); if(!error){ USERS = data || []; profiles = Object.fromEntries(USERS.map(p => [p.id, p])); return USERS; } newApi = false; }
    const { data } = await sb.from('profiles').select('*').order('created_at', {ascending:false}).limit(3000);
    USERS = data || []; profiles = Object.fromEntries(USERS.map(p => [p.id, p])); return USERS;
  }

  /* ---------- KPIs ---------- */
  function drawKpis(){
    const s = OV || {}, conv = s.users ? Math.round((s.active || 0) * 1000 / s.users) / 10 : 0;
    const k = [
      [n(s.users), 'كل الحسابات', s.new_today != null ? `+${n(s.new_today)} اليوم` : ''],
      [n(s.new_7d ?? '—'), 'تسجيلات آخر ٧ أيام', s.new_30d != null ? `${n(s.new_30d)} في ٣٠ يوم` : ''],
      [n(s.active), 'حسابات مفعّلة', s.users ? `نسبة التحويل ${conv}%` : ''],
      [s.revenue != null ? n(s.revenue) : '—', 'الإيرادات (ريال)', s.revenue_30d != null ? `${n(s.revenue_30d)} ريال في ٣٠ يوم` : ''],
      [n(s.pending), 'إيصالات للمراجعة', '', 'warn'],
      [n(s.seen_7d ?? '—'), 'دخلوا آخر ٧ أيام', ''],
      [n(s.learners ?? '—'), 'بدأوا الدروس', s.pilots != null ? `${n(s.pilots)} جرّبوا المحاكي` : ''],
      [n(s.blocked), 'حسابات موقوفة', s.rejected != null ? `${n(s.rejected)} إيصال مرفوض` : '']
    ];
    $('#kpis').innerHTML = k.map(([v, l, sub, c]) => `<div class="${c || ''}"><b>${v}</b><span>${l}</span>${sub ? `<small>${sub}</small>` : ''}</div>`).join('');
    const pn = $('#pn'); pn.hidden = !s.pending; pn.textContent = s.pending || '';
  }

  /* ---------- overview ---------- */
  function chart(daily){
    if(!daily || !daily.length) return '<p class="muted">لا توجد بيانات بعد.</p>';
    const W = 620, H = 190, pad = 22, bw = (W - pad) / daily.length, mx = Math.max(1, ...daily.map(d => Math.max(d.u, d.p)));
    const y = v => H - 22 - (v / mx) * (H - 40);
    let g = '';
    for(let i = 0; i <= 4; i++){ const v = Math.round(mx * i / 4), yy = y(v); g += `<line x1="${pad}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#ffffff12"/><text x="${pad - 4}" y="${yy + 4}" fill="#8a8574" font-size="10" text-anchor="end" font-family="IBM Plex Mono">${v}</text>`; }
    daily.forEach((d, i) => { const x = pad + i * bw, w = Math.max(2, bw / 2 - 1.5), dd = new Date(d.d + 'T00:00:00');
      const lbl = dd.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', {day:'numeric', month:'short'});
      g += `<g><title>${lbl}: ${d.u} تسجيل · ${d.p} تفعيل</title><rect x="${x + 1}" y="${y(d.u)}" width="${w}" height="${H - 22 - y(d.u)}" rx="2" fill="#d8bf86"/><rect x="${x + 1 + w + 1}" y="${y(d.p)}" width="${w}" height="${H - 22 - y(d.p)}" rx="2" fill="#7cd39b"/><rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent"/></g>`;
      if(i % 5 === 4 || i === daily.length - 1) g += `<text x="${x + bw / 2}" y="${H - 6}" fill="#8a8574" font-size="10" text-anchor="middle">${lbl}</text>`; });
    return `<svg viewBox="0 0 ${W} ${H}" direction="ltr">${g}</svg><div class="legend"><span><i style="background:#d8bf86"></i>تسجيلات</span><span><i style="background:#7cd39b"></i>تفعيلات</span></div>`;
  }
  function overview(el){
    const s = OV || {};
    if(!newApi){ el.innerHTML = `<div class="empty">التفاصيل الإضافية تحتاج تشغيل ملف <b>supabase/admin.sql</b> مرة وحدة في Supabase.</div>`; return; }
    const users = s.users || 0, f = [['سجّلوا', users], ['بدأوا درس', s.learners || 0], ['جرّبوا المحاكي', s.pilots || 0], ['فعّلوا الحساب', s.active || 0]];
    const L = s.lessons || [], maxL = Math.max(1, ...L.map(l => l.n)), MS = s.missions || [], maxM = Math.max(1, ...MS.map(m => m.n));
    el.innerHTML = `<div class="grid2">
      <div class="box chart"><h3>آخر ٣٠ يوم <small>${n(s.new_30d)} تسجيل</small></h3>${chart(s.daily)}</div>
      <div class="box"><h3>مسار العميل <small>من التسجيل للتفعيل</small></h3><div class="funnel">${f.map(([l, v], i) => `<div class="r"><span>${l}</span><div class="bar ${i === 3 ? 'g' : ''}"><i style="width:${users ? Math.max(1.5, v * 100 / users) : 0}%"></i></div><span class="v">${n(v)}</span></div>`).join('')}</div>
        <p class="note" style="margin:14px 0 0">${users ? `من كل ١٠٠ مسجّل، تقريباً <b style="color:var(--sand)">${Math.round((s.active || 0) * 100 / users)}</b> فعّلوا حسابهم.` : ''}</p></div>
    </div>
    <div class="grid2">
      <div class="box"><h3>الدروس <small>كم واحد أنهى كل درس ومتوسط درجته</small></h3><table class="mini"><thead><tr><th>الدرس</th><th>أنهوه</th><th></th><th>المتوسط</th></tr></thead><tbody>${L.map(l => `<tr><td>${esc(l.title)}${l.free ? ' <span class="chip ok">مجاني</span>' : ''}</td><td class="num">${n(l.n)}</td><td><div class="bar"><i style="width:${l.n * 100 / maxL}%"></i></div></td><td class="num">${l.avg != null ? l.avg + '%' : '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">لا يوجد</td></tr>'}</tbody></table></div>
      <div class="box"><h3>المحاكي <small>عدد اللي أنجزوا كل مهمة</small></h3><table class="mini"><thead><tr><th>المهمة</th><th>أنجزوها</th><th></th><th>أفضل وقت</th></tr></thead><tbody>${MS.map(m => `<tr><td>${esc(MN[m.m] || m.m)}</td><td class="num">${n(m.n)}</td><td><div class="bar g"><i style="width:${m.n * 100 / maxM}%"></i></div></td><td class="num">${(+m.best).toFixed(1)}s</td></tr>`).join('') || '<tr><td colspan="4" class="muted">ما أحد أنجز مهمة للحين</td></tr>'}</tbody></table></div>
    </div>`;
  }

  /* ---------- receipts ---------- */
  let rcFilter = 'all', rcQ = '';
  async function receipts(el, mode){
    el.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
    let q = sb.from('payments').select('*').order('created_at', {ascending: false}).limit(500);
    if(mode === 'pending') q = q.eq('status', 'pending');
    const { data } = await q;
    if(!data || !data.length){ el.innerHTML = `<div class="empty">${mode === 'pending' ? 'لا توجد إيصالات تنتظر المراجعة. 👌' : 'لا توجد إيصالات بعد.'}</div>`; return; }
    if(!Object.keys(profiles).length) await loadUsers();
    const urls = await sb.storage.from('receipts').createSignedUrls(data.map(p => p.receipt_path), 3600);
    const map = Object.fromEntries((urls.data || []).map(u => [u.path, u.signedUrl]));
    const lbl = {pending:'<span class="chip warn">قيد المراجعة</span>', approved:'<span class="chip ok">مقبول</span>', rejected:'<span class="chip bad">مرفوض</span>'};
    const cnt = st => data.filter(p => st === 'all' || p.status === st).length;
    const head = mode === 'pending' ? '' : `<div class="tools"><input class="search" id="rc-q" type="search" placeholder="ابحث بالبريد أو اسم المحوِّل" value="${esc(rcQ)}"><div class="flt" id="rc-f">${[['all','الكل'],['pending','قيد المراجعة'],['approved','مقبول'],['rejected','مرفوض']].map(([k, l]) => `<button data-f="${k}" class="${rcFilter === k ? 'on' : ''}">${l}<em>${cnt(k)}</em></button>`).join('')}</div></div><p class="sum" id="rc-sum"></p>`;
    el.innerHTML = head + '<div class="rcpts" id="rc-l-' + mode + '"></div>';
    const draw = () => {
      const qq = rcQ.trim().toLowerCase();
      const list = data.filter(p => (mode === 'pending' || rcFilter === 'all' || p.status === rcFilter) && (!qq || ((profiles[p.user_id] || {}).email + ' ' + (p.sender_name || '')).toLowerCase().includes(qq)));
      const sumEl = $('#rc-sum'); if(sumEl) sumEl.innerHTML = `${n(list.length)} إيصال · المجموع <b>${n(list.filter(p => p.status !== 'rejected').reduce((a, p) => a + (+p.amount || 0), 0))}</b> ر.س`;
      const box = $('#rc-l-' + mode);
      box.innerHTML = list.map(p => { const u = map[p.receipt_path], pr = profiles[p.user_id] || {}; const pdf = /\.pdf$/i.test(p.receipt_path);
        return `<div class="rc" data-id="${p.id}" data-u="${p.user_id}"><div class="img">${u ? (pdf ? `<a href="${u}" target="_blank" rel="noopener">فتح ملف PDF</a>` : `<img src="${u}" alt="إيصال" loading="lazy">`) : '<span class="note">الملف غير متاح</span>'}</div>
          <div class="meta"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.sender_name || '—')}</b>${lbl[p.status]}</div><div class="em" data-who title="عرض تفاصيل العميل">${esc(pr.email || p.user_id)}</div><div class="note">${fmt(p.created_at)} · ${esc(p.amount ?? '')} ر.س${p.reviewed_at ? ' · روجع ' + ago(p.reviewed_at) : ''}</div>${p.note ? `<div class="note">ملاحظة: ${esc(p.note)}</div>` : ''}</div>
          ${p.status === 'pending' ? `<div class="acts"><button class="btn pri sm" data-ok>قبول</button><button class="btn sm no" data-no>رفض وإيقاف الحساب</button></div>` : ''}</div>`; }).join('') || '<div class="empty" style="grid-column:1/-1">لا نتائج.</div>';
      box.querySelectorAll('.rc img').forEach(i => i.onclick = () => { const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = `<img src="${i.src}" alt="إيصال">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); });
      box.querySelectorAll('.rc').forEach(card => {
        const id = +card.dataset.id, ok = card.querySelector('[data-ok]'), no = card.querySelector('[data-no]');
        card.querySelector('[data-who]').onclick = () => openUser(card.dataset.u);
        if(ok) ok.onclick = async () => { ok.disabled = true; const { error } = await sb.rpc('admin_review', {p_id:id, p_approve:true}); if(error){ ok.disabled = false; return toast(error.message, 1); } toast('تم القبول'); card.remove(); refreshTop(); };
        if(no) no.onclick = async () => {
          if(no.dataset.sure !== '1'){ no.dataset.sure = '1'; no.textContent = 'اضغط مرة ثانية للتأكيد'; setTimeout(() => { no.dataset.sure = ''; no.textContent = 'رفض وإيقاف الحساب'; }, 4000); return; }
          no.disabled = true; const { error } = await sb.rpc('admin_review', {p_id:id, p_approve:false, p_note:'إيصال غير صحيح'}); if(error) return toast(error.message, 1); toast('تم الرفض وإيقاف الحساب'); card.remove(); refreshTop(); };
      });
    };
    draw();
    if(mode !== 'pending'){ $('#rc-q').oninput = e => { rcQ = e.target.value; draw(); };
      $('#rc-f').onclick = e => { const b = e.target.closest('button'); if(!b) return; rcFilter = b.dataset.f; $$('#rc-f button').forEach(x => x.classList.toggle('on', x === b)); draw(); }; }
  }

  /* ---------- users ---------- */
  let uFilter = 'all', uSort = 'new', uQ = '';
  const UF = { all:['الكل', () => true], act:['مفعّل', isAct], free:['مجاني', p => !isAct(p) && !p.blocked], blk:['موقوف', p => p.blocked],
    new7:['جدد ٧ أيام', p => new Date(p.created_at) > Date.now() - 7*864e5], idle:['ما دخلوا ٣٠ يوم', p => !p.last_seen || new Date(p.last_seen) < Date.now() - 30*864e5],
    learn:['بدأوا الدروس', p => p.lessons > 0], adm:['مسؤول', p => p.is_admin] };
  function filtered(){ const q = uQ.trim().toLowerCase(), f = UF[uFilter][1];
    const l = USERS.filter(p => f(p) && (!q || ((p.email || '') + ' ' + (p.full_name || '')).toLowerCase().includes(q)));
    const by = { new:(a, b) => new Date(b.created_at) - new Date(a.created_at), seen:(a, b) => new Date(b.last_seen || 0) - new Date(a.last_seen || 0),
      lessons:(a, b) => (b.lessons || 0) - (a.lessons || 0), sim:(a, b) => (b.missions || 0) - (a.missions || 0), name:(a, b) => (a.full_name || a.email || '').localeCompare(b.full_name || b.email || '', 'ar') };
    return l.sort(by[uSort]); }
  async function users(el){
    el.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
    await loadUsers();
    const has = USERS.length && 'lessons' in USERS[0];
    el.innerHTML = `<div class="tools"><input class="search" id="u-q" type="search" placeholder="ابحث بالبريد أو الاسم" value="${esc(uQ)}">
      <select class="sel" id="u-s"><option value="new">الأحدث تسجيلاً</option>${has ? '<option value="seen">آخر دخول</option><option value="lessons">الأكثر دروساً</option><option value="sim">الأكثر في المحاكي</option>' : ''}<option value="name">الاسم</option></select>
      <button class="btn sm" id="u-csv">⬇ تصدير CSV</button></div>
      <div class="tools"><div class="flt" id="u-f">${Object.entries(UF).filter(([k]) => has || !['idle','learn'].includes(k)).map(([k, [l, f]]) => `<button data-f="${k}" class="${uFilter === k ? 'on' : ''}">${l}<em>${USERS.filter(f).length}</em></button>`).join('')}</div></div>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>المستخدم</th><th>التسجيل</th>${has ? '<th>آخر دخول</th><th>الدروس</th><th>المحاكي</th>' : ''}<th>الحالة</th></tr></thead><tbody id="u-b"></tbody></table></div><p class="sum" id="u-sum" style="margin-top:10px"></p>`;
    $('#u-s').value = uSort;
    const draw = () => { const l = filtered();
      $('#u-b').innerHTML = l.slice(0, 400).map(p => `<tr data-u="${p.id}"><td><div class="who">${avatar(p)}<div class="t"><b>${esc(p.full_name || '—')}</b><span>${esc(p.email || '')}</span></div></div></td><td class="muted" title="${fmt(p.created_at)}">${ago(p.created_at)}</td>${has ? `<td class="muted" title="${fmt(p.last_seen)}">${ago(p.last_seen)}</td><td class="num">${p.lessons || 0}</td><td class="num">${p.missions || 0}</td>` : ''}<td>${status(p)}</td></tr>`).join('') || `<tr><td colspan="6" class="muted">لا نتائج.</td></tr>`;
      $('#u-sum').textContent = `${l.length} مستخدم${l.length > 400 ? ' · يظهر أول ٤٠٠' : ''}`; };
    draw();
    $('#u-q').oninput = e => { uQ = e.target.value; draw(); };
    $('#u-s').onchange = e => { uSort = e.target.value; draw(); };
    $('#u-f').onclick = e => { const b = e.target.closest('button'); if(!b) return; uFilter = b.dataset.f; $$('#u-f button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
    $('#u-b').onclick = e => { const tr = e.target.closest('tr[data-u]'); if(tr) openUser(tr.dataset.u); };
    $('#u-csv').onclick = () => { const l = filtered(), cols = ['email','full_name','created_at','last_seen','status','lessons','missions','receipts'];
      const st = p => p.blocked ? 'blocked' : isAct(p) ? 'active' : 'free';
      const csv = '﻿' + cols.join(',') + '\n' + l.map(p => cols.map(c => { const v = c === 'status' ? st(p) : (p[c] ?? ''); return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',')).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = `knowuav-users-${new Date().toISOString().slice(0,10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  }

  /* ---------- user drawer ---------- */
  async function openUser(id){
    if(!profiles[id]) await loadUsers();
    const p = profiles[id]; if(!p) return toast('المستخدم غير موجود', 1);
    const d = document.createElement('div'); d.className = 'drawer'; document.body.appendChild(d);
    const close = () => { d.remove(); document.removeEventListener('keydown', esc_); };
    const esc_ = e => { if(e.key === 'Escape') close(); }; document.addEventListener('keydown', esc_);
    d.onclick = e => { if(e.target === d) close(); };
    d.innerHTML = `<div class="pn"><div class="empty">جارٍ التحميل…</div></div>`;
    let det = { progress:[], sim:[], payments:[] };
    if(newApi){ const { data } = await sb.rpc('admin_user_detail', {p_user:id}); if(data) det = data; }
    else { const { data } = await sb.from('payments').select('*').eq('user_id', id).order('created_at', {ascending:false}); det.payments = (data || []).map(y => ({id:y.id, status:y.status, amount:y.amount, sender:y.sender_name, path:y.receipt_path, note:y.note, at:y.created_at, reviewed:y.reviewed_at})); }
    const urls = det.payments.length ? await sb.storage.from('receipts').createSignedUrls(det.payments.map(y => y.path), 3600) : {data:[]};
    const um = Object.fromEntries((urls.data || []).map(u => [u.path, u.signedUrl]));
    const act = isAct(p), stl = {pending:'<span class="chip warn">قيد المراجعة</span>', approved:'<span class="chip ok">مقبول</span>', rejected:'<span class="chip bad">مرفوض</span>'};
    const prov = {email:'بريد وكلمة مرور', google:'قوقل'}[p.provider] || p.provider || '—';
    d.querySelector('.pn').innerHTML = `
      <div class="top">${avatar(p)}<div><h2>${esc(p.full_name || 'بدون اسم')}</h2><div class="em" id="d-em" title="نسخ">${esc(p.email || '')}</div><div style="margin-top:4px">${status(p)}</div></div><button class="x" id="d-x" aria-label="إغلاق">✕</button></div>
      <div class="facts">
        <div><span>التسجيل</span>${fmt(p.created_at)}</div><div><span>آخر دخول</span>${p.last_seen !== undefined ? fmt(p.last_seen) : '—'}</div>
        <div><span>طريقة الدخول</span>${esc(prov)}</div><div><span>تأكيد البريد</span>${p.confirmed ? 'مؤكّد' : p.confirmed === null ? 'غير مؤكّد' : '—'}</div>
        <div><span>التفعيل</span>${act ? 'مفعّل مدى الحياة' : p.blocked ? 'موقوف' : 'غير مفعّل'}</div><div><span>المعرّف</span><span class="num" style="font-size:11px;color:var(--muted)">${esc(id.slice(0, 8))}…</span></div>
      </div>
      <div class="acts2">
        ${act ? '<button class="btn sm" data-a="revoke">إلغاء التفعيل</button>' : '<button class="btn sm pri" data-a="grant">تفعيل الحساب</button>'}
        ${p.blocked ? '<button class="btn sm" data-a="unblock">إلغاء الإيقاف</button>' : '<button class="btn sm no" data-a="block">إيقاف الحساب</button>'}
        ${p.email ? '<button class="btn sm" data-a="reset">إرسال رابط استعادة كلمة المرور</button>' : ''}
        ${p.avatar_url ? '<button class="btn sm no" data-a="ava">حذف الصورة</button>' : ''}
        ${det.sim.length ? '<button class="btn sm no" data-a="sim">مسح نتائج المحاكي</button>' : ''}
      </div>
      <h4>الدروس (${det.progress.length})</h4>
      ${det.progress.length ? `<table class="mini"><tbody>${det.progress.map(g => `<tr><td>${esc(g.title)}</td><td class="num">${g.score}/${g.total}</td><td class="muted">${ago(g.at)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">ما بدأ أي درس للحين.</p>'}
      <h4>المحاكي (${det.sim.length})</h4>
      ${det.sim.length ? `<table class="mini"><tbody>${det.sim.map(s => `<tr><td>${esc(MN[s.m] || s.m)}</td><td class="num">${(+s.t).toFixed(1)}s</td><td class="muted">${ago(s.at)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">ما أنجز أي مهمة.</p>'}
      <h4>الإيصالات (${det.payments.length})</h4>
      ${det.payments.length ? `<table class="mini"><tbody>${det.payments.map(y => `<tr><td>${stl[y.status] || ''}</td><td>${esc(y.sender || '—')}</td><td class="num">${esc(y.amount ?? '')} ر.س</td><td class="muted">${fmtD(y.at)}</td><td>${um[y.path] ? `<a href="${um[y.path]}" target="_blank" rel="noopener" style="color:var(--sand)">عرض</a>` : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">ما رفع أي إيصال.</p>'}`;
    d.querySelector('#d-x').onclick = close;
    d.querySelector('#d-em').onclick = () => copy(p.email || '');
    d.querySelector('.acts2').onclick = async e => { const b = e.target.closest('[data-a]'); if(!b) return; const a = b.dataset.a;
      const danger = {block:1, revoke:1, ava:1, sim:1};
      if(danger[a] && b.dataset.sure !== '1'){ const t = b.textContent; b.dataset.sure = '1'; b.textContent = 'اضغط مرة ثانية للتأكيد'; setTimeout(() => { b.dataset.sure = ''; b.textContent = t; }, 4000); return; }
      b.disabled = true; let r = {};
      if(a === 'grant') r = await sb.rpc('admin_grant', {p_user:id, p_days:36500});
      if(a === 'revoke') r = await sb.rpc('admin_revoke', {p_user:id});
      if(a === 'block' || a === 'unblock') r = await sb.rpc('admin_set_blocked', {p_user:id, p_blocked: a === 'block'});
      if(a === 'ava') r = await sb.rpc('admin_clear_avatar', {p_user:id});
      if(a === 'sim') r = await sb.rpc('admin_clear_sim', {p_user:id, p_mission:null});
      if(a === 'reset') r = await sb.auth.resetPasswordForEmail(p.email, {redirectTo: location.origin + '/app'});
      if(r.error){ b.disabled = false; return toast(r.error.message, 1); }
      toast({grant:'تم تفعيل الحساب', revoke:'تم إلغاء التفعيل', block:'تم إيقاف الحساب', unblock:'تم إلغاء الإيقاف', ava:'تم حذف الصورة', sim:'تم مسح نتائج المحاكي', reset:'تم إرسال رابط الاستعادة لبريده'}[a]);
      if(a === 'reset'){ b.disabled = false; return; }
      close(); await loadUsers(); refreshTop(); if(!$('#t-users').hidden) users($('#t-users')); openUser(id); };
  }

  /* ---------- activity ---------- */
  async function activity(el){
    if(!newApi){ el.innerHTML = '<div class="empty">آخر النشاط يحتاج تشغيل ملف <b>supabase/admin.sql</b> في Supabase.</div>'; return; }
    el.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
    const { data, error } = await sb.rpc('admin_activity', {p_limit:60});
    if(error) return el.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    const IC = {signup:'👋', receipt:'🧾', lesson:'📘', sim:'🎮'}, RS = {pending:'رفع إيصال للمراجعة', approved:'إيصال مقبول', rejected:'إيصال مرفوض'};
    const what = e => e.k === 'signup' ? 'سجّل حساب جديد' : e.k === 'receipt' ? (RS[e.x] || 'إيصال') : e.k === 'lesson' ? 'أنهى درس: ' + esc(e.x) : 'أنجز مهمة: ' + esc(e.x.replace(/^(\w+)/, m => MN[m] || m)) + 's';
    el.innerHTML = (data || []).length ? `<div class="feed">${data.map(e => `<div class="e"><span class="ic">${IC[e.k] || '•'}</span><div><b>${esc(e.full_name || e.email || '—')}</b> <span class="x">${what(e)}</span></div><span class="w" title="${fmt(e.at)}">${ago(e.at)}</span></div>`).join('')}</div>` : '<div class="empty">لا يوجد نشاط بعد.</div>';
  }

  /* ---------- settings ---------- */
  async function settings(el){
    const { data } = await sb.from('app_settings').select('*');
    const s = Object.fromEntries((data || []).map(r => [r.key, r.value]));
    const F = [['price','سعر التفعيل (ريال)'],['bank_name','اسم البنك'],['account_name','اسم صاحب الحساب'],['iban','رقم الآيبان IBAN'],['stcpay','رقم STC Pay'],['pay_note','ملاحظة تظهر للمشترك'],['offer_price','سعر العرض (ريال) · فاضي = بدون عرض'],['offer_until','نهاية العرض مثال 2026-10-16T02:00:00+03:00']];
    el.innerHTML = `<div class="card"><p class="note" style="margin-top:0">هذه البيانات تظهر للمستخدم في صفحة الدفع. الحقل الفارغ لا يظهر.</p><form id="set-f" class="set">${F.map(([k, l]) => `<label class="field">${l}<input name="${k}" value="${esc(s[k] || '')}" ${['iban','stcpay','price','offer_price','offer_until'].includes(k) ? 'dir="ltr"' : ''}></label>`).join('')}</form><div class="row" style="margin-top:16px"><button class="btn pri" id="set-save">حفظ</button></div></div>`;
    $('#set-save').onclick = async () => { const rows = [...new FormData($('#set-f')).entries()].map(([key, value]) => ({key, value: String(value).trim()}));
      const { error } = await sb.from('app_settings').upsert(rows); if(error) return toast(error.message, 1); toast('تم الحفظ'); };
  }

  /* ---------- tabs ---------- */
  const views = { overview, pending: el => receipts(el, 'pending'), all: el => receipts(el, 'all'), users, activity, settings };
  let cur = 'overview';
  const show = t => { cur = t; $$('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === t)); Object.keys(views).forEach(k => $('#t-' + k).hidden = k !== t); views[t]($('#t-' + t)); };
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if(b) show(b.dataset.t); };
  async function refreshTop(){ await loadOverview(); if(cur === 'overview') overview($('#t-overview')); }
  $('#refresh').onclick = async () => { await loadOverview(); await loadUsers(); show(cur); toast('تم التحديث'); };
  await Promise.all([loadOverview(), loadUsers()]);
  show(OV && OV.pending ? 'pending' : 'overview');
})();
</script>
</body>
</html>
